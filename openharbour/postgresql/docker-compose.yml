services:
  postgresql:
    image: ghcr.io/OpenHarbour/postgresql:18
    ports:
      - '5432:5432'
    volumes:
      - 'postgresql_data:/openharbour/postgresql'
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'

volumes:
  postgresql_data:
    driver: local
